databases:
  - name: stoxarea-db
    databaseName: stoxarea
    user: stoxarea
    plan: free

services:
  # ── BACKEND (FastAPI) ────────────────────────────────────────
  - type: web
    name: stoxarea-backend
    runtime: docker
    rootDir: stoxarea-backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres.akytzkebyghoxmvqgnst:miiwaashi16@aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres
      - key: SECRET_KEY
        value: stoxarea-production-secret-2024-xgboost-saw-spk
      - key: ALLOWED_ORIGINS
        value: https://stoxarea.vercel.app,https://stoxarea-frontend.vercel.app,http://localhost:3000
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health

  # ── FRONTEND (Next.js) ──────────────────────────────────────
  - type: web
    name: stoxarea-frontend
    runtime: node
    rootDir: stoxarea-frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://stoxarea-backend.onrender.com
      - key: NODE_ENV
        value: production
    buildFilter:
      paths:
        - stoxarea-frontend/**

databases:
  - name: stoxarea-db
    databaseName: stoxarea
    user: stoxarea
    plan: free

services:
  # ── BACKEND (FastAPI) ────────────────────────────────────────
  - type: web
    name: stoxarea-backend
    runtime: docker
    rootDir: stoxarea-backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stoxarea-db
          property: connectionString
      - key: SECRET_KEY
        value: stoxarea-production-secret-2024-xgboost-saw-spk
      - key: ALLOWED_ORIGINS
        value: https://stoxarea-frontend.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health

  # ── FRONTEND (Next.js) ──────────────────────────────────────
  - type: web
    name: stoxarea-frontend
    runtime: node
    rootDir: stoxarea-frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://stoxarea-backend.onrender.com
      - key: NODE_ENV
        value: production
    buildFilter:
      paths:
        - stoxarea-frontend/**
